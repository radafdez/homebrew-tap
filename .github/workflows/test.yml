name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install, check and uninstall the cask
        env:
          # `brew audit --online` asks GitHub about the repository; without a
          # token the shared runner IPs hit the anonymous rate limit.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: ./scripts/check-cask.sh
