# Once a day, points the cask at the latest release of Keyturn. It
# only pushes after the new version installs and uninstalls cleanly. A push
# made with the workflow's own token does not start Test, so the check runs
# here, before the push.
#
# Una vez al día apunta el cask a la última versión de Keyturn. Solo
# sube el cambio si la versión nueva se instala y se desinstala bien. Un push
# hecho con el token del propio flujo no lanza Test, así que la comprobación va
# aquí, antes del push.
name: Bump

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Find the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view -R radafdez/keyturn --json tagName -q .tagName)"
          current="$(sed -n -E 's/^  version "([^"]*)"$/\1/p' Casks/keyturn.rb)"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [ "${tag#v}" = "$current" ]; then
            echo "The cask is already at $current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update, check and push
        if: steps.latest.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          ./scripts/bump.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "keyturn $VERSION"
          ./scripts/check-cask.sh
          git push
